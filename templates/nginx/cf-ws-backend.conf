# Nginx 反向代理配置範本（終結 Cloudflare 回源 TLS 並轉發 WebSocket）
# 檔案建議放置於: /etc/nginx/conf.d/cf-ws-backend.conf (或 include 至 http 區塊)

server {
    # 若為獨立主機直接接管 443，可改為: listen 443 ssl;
    # 若與既有 SNI 分流共存，監聽內部回環高位埠即可:
    listen 127.0.0.1:8446 ssl;
    http2 on;

    # 填入你的專用橘雲子網域
    server_name cdn.example.com;

    # Cloudflare 15 年 Origin CA 憑證與私鑰路徑
    ssl_certificate     /etc/ssl/cf_origin.pem;
    ssl_certificate_key /etc/ssl/cf_origin.key;

    # 現代化安全加密套件
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 隨機高熵路徑（請替換為你的隨機字串，需與 sing-box inbound 一致）
    location /cfws_YOUR_SECRET_PATH {
        # 僅允許真正的 WebSocket 升級請求，其餘探測直接回傳 404
        if ($http_upgrade != "websocket") {
            return 404;
        }

        # 轉發給本機 sing-box 監聽的明文端口
        proxy_pass http://127.0.0.1:9445;
        proxy_http_version 1.1;

        # WebSocket 升級必要標頭
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # 傳遞真實客戶端 IP（來自 Cloudflare 標頭）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 防止閒置連線過早中斷
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 任何其他路徑或根目錄直接回傳 404，防止主動探測
    location / {
        return 404;
    }
}
