# Nginx Stream 模組 SNI 分流範本
# 當 VPS 443 埠已被其他協議（如 Reality / AnyTLS / Web 服務）佔用時使用

stream {
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name -> $backend';
    access_log /var/log/nginx/stream-access.log sni;

    map $ssl_preread_server_name $backend {
        # 新增此行：專用橘雲子網域導向內部 TLS 終結端口
        cdn.example.com      cf_ws_backend;

        # 既有服務示例（維持不變）
        # your-existing.com  web_service;
        # default            reality_inbound;
    }

    upstream cf_ws_backend {
        server 127.0.0.1:8446;
    }

    # 監聽外部 443 埠做 SNI 分流
    server {
        listen 443;
        listen [::]:443;
        proxy_pass $backend;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 600s;
    }
}
